# Copier template configuration.
#
# This file IS the wizard: every top-level key that isn't prefixed with `_` becomes a
# question Copier asks interactively (or accepts as --data key=value / -A for defaults).
# See https://copier.readthedocs.io/en/stable/configuring/
_min_copier_version: "9.19.0"
_subdirectory: template

# Only files that end in this suffix are rendered as Jinja templates; others are copied
# verbatim. Keeping the default (.jinja) means plain files (e.g. .markdownlint-cli2.yaml)
# don't need any suffix dance.
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_message_before_copy: |
  Generating your Python project...

  Answer the questions below. Press Enter to accept the default shown in [brackets].

_message_after_copy: |
  Done! Your project is in {{ _copier_conf.dst_path }}.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    git status            # tasks already ran: git init, uv sync, prek install
    uv run pytest

  Later, to pull in template updates:
    uvx copier update --trust

# --- Questions -----------------------------------------------------------------------

project_name:
  type: str
  help: "Project name (human-readable)?"
  placeholder: "My Awesome Project"
  validator: >-
    {% if not project_name.strip() %}Project name cannot be empty{% endif %}

project_slug:
  type: str
  help: "Project slug (PyPI / repo name)?"
  default: "{{ project_name.lower().strip().replace(' ', '-').replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Slug must be lowercase, start with a letter, and contain only letters, digits and hyphens
    {% endif %}

package_name:
  type: str
  help: "Python package / import name?"
  default: "{{ project_slug.replace('-', '_') }}"
  # The stdlib list below is the union of `sys.stdlib_module_names` for Python 3.12-3.14
  # (the versions this wizard offers), minus names starting with "_" (already rejected by
  # the regex below), plus "test" by hand — CPython's docs say stdlib_module_names omits
  # test modules, and "test" itself is one such omission. Regenerate by running, on each
  # supported version: python3 -c "import sys; print(sorted(n for n in sys.stdlib_module_names if not n.startswith('_')))"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Package name must be lowercase, start with a letter, and contain only letters, digits
    and underscores
    {% elif package_name in [
    "abc", "aifc", "annotationlib", "antigravity", "argparse", "array", "ast", "asyncio",
    "atexit", "audioop", "base64", "bdb", "binascii", "bisect", "builtins", "bz2", "calendar",
    "cgi", "cgitb", "chunk", "cmath", "cmd", "code", "codecs", "codeop", "collections",
    "colorsys", "compileall", "compression", "concurrent", "configparser", "contextlib",
    "contextvars", "copy", "copyreg", "cProfile", "crypt", "csv", "ctypes", "curses",
    "dataclasses", "datetime", "dbm", "decimal", "difflib", "dis", "doctest", "email",
    "encodings", "ensurepip", "enum", "errno", "faulthandler", "fcntl", "filecmp", "fileinput",
    "fnmatch", "fractions", "ftplib", "functools", "gc", "genericpath", "getopt", "getpass",
    "gettext", "glob", "graphlib", "grp", "gzip", "hashlib", "heapq", "hmac", "html", "http",
    "idlelib", "imaplib", "imghdr", "importlib", "inspect", "io", "ipaddress", "itertools",
    "json", "keyword", "lib2to3", "linecache", "locale", "logging", "lzma", "mailbox",
    "mailcap", "marshal", "math", "mimetypes", "mmap", "modulefinder", "msilib", "msvcrt",
    "multiprocessing", "netrc", "nis", "nntplib", "nt", "ntpath", "nturl2path", "numbers",
    "opcode", "operator", "optparse", "os", "ossaudiodev", "pathlib", "pdb", "pickle",
    "pickletools", "pipes", "pkgutil", "platform", "plistlib", "poplib", "posix", "posixpath",
    "pprint", "profile", "pstats", "pty", "pwd", "py_compile", "pyclbr", "pydoc",
    "pydoc_data", "pyexpat", "queue", "quopri", "random", "re", "readline", "reprlib",
    "resource", "rlcompleter", "runpy", "sched", "secrets", "select", "selectors", "shelve",
    "shlex", "shutil", "signal", "site", "smtplib", "sndhdr", "socket", "socketserver",
    "spwd", "sqlite3", "sre_compile", "sre_constants", "sre_parse", "ssl", "stat",
    "statistics", "string", "stringprep", "struct", "subprocess", "sunau", "symtable", "sys",
    "sysconfig", "syslog", "tabnanny", "tarfile", "telnetlib", "tempfile", "termios", "test",
    "textwrap", "this", "threading", "time", "timeit", "tkinter", "token", "tokenize",
    "tomllib", "trace", "traceback", "tracemalloc", "tty", "turtle", "turtledemo", "types",
    "typing", "unicodedata", "unittest", "urllib", "uu", "uuid", "venv", "warnings", "wave",
    "weakref", "webbrowser", "winreg", "winsound", "wsgiref", "xdrlib", "xml", "xmlrpc",
    "zipapp", "zipfile", "zipimport", "zlib", "zoneinfo"
    ] %}
    "{{ package_name }}" is a Python standard-library module name — imports would load the
    stdlib one instead of your package, so pick something else
    {% endif %}

description:
  type: str
  help: "Short description?"
  default: ""

author_name:
  type: str
  help: "Author name?"
  default: "Your Name"

author_email:
  type: str
  help: "Author email?"
  default: "you@example.com"

github_owner:
  type: str
  help: "GitHub username or org this project will live under?"
  default: "your-github-username"

python_version:
  type: str
  help: "Python version?"
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.13"

license:
  type: str
  help: "License?"
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - Proprietary
  default: MIT

add_cli:
  type: bool
  help: "Add a command-line interface (Typer)?"
  default: false

use_docker:
  type: bool
  help: "Include a Dockerfile and container build job?"
  default: "{{ add_cli }}"

use_docs:
  type: bool
  help: "Include a documentation site (zensical) and Pages deploy job?"
  default: true

publish_target:
  type: str
  help: "Where should releases publish the Python package?"
  choices:
    - pypi
    - github-release
  default: pypi

coverage_threshold:
  type: int
  help: "Minimum test coverage percentage (CI fails below this)?"
  default: 80

# --- Post-generation tasks -------------------------------------------------------------
# These run in the system shell (cmd.exe on Windows), so no bash-isms (no `&&` chaining
# tricks, no `[ -f ... ]`, no `rm -rf`). Each task is its own plain command for that reason.
_tasks:
  - command: "git init"
  # Pin hooks to this repo's own .git/hooks, overriding any core.hooksPath the developer's
  # machine sets globally (e.g. a personal dotfiles setup) — --local scopes this to just this
  # project, it does not touch their global git config.
  - command: "git config --local core.hooksPath .git/hooks"
  - command: "uv sync"
  - command: "uv run prek install --force"
